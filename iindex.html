<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gulmi Easy Travel - Premium EV Hiace Booking</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #008037; /* Eco Green for EV */
            --secondary: #1a365d; /* Royal Navy Blue */
            --accent: #ff9f43;
            --light-bg: #f8fafc;
            --white: #ffffff;
            --text: #2d3748;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--light-bg);
            color: var(--text);
            padding-bottom: 40px;
        }

        /* Header / Hero Section */
        .hero {
            background: linear-gradient(135deg, var(--secondary) 0%, #0d2137 100%);
            color: var(--white);
            text-align: center;
            padding: 40px 20px;
            border-bottom-left-radius: 25px;
            border-bottom-right-radius: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .hero h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .hero p {
            font-size: 14px;
            color: #cbd5e0;
        }

        .badge-ev {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        /* Main Container */
        .container {
            max-width: 480px;
            margin: -20px auto 0 auto;
            padding: 0 15px;
        }

        /* Form Card */
        .card {
            background: var(--white);
            border-radius: 16px;
            padding: 25px 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--secondary);
            margin-bottom: 6px;
        }

        .form-group label i {
            color: var(--primary);
            margin-right: 5px;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
            background-color: #fdfdfd;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 128, 55, 0.15);
        }

        /* Price Box */
        .fare-box {
            background-color: #f0fdf4;
            border: 1px dashed var(--primary);
            padding: 12px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .fare-box span {
            font-size: 14px;
            color: var(--secondary);
            font-weight: 600;
        }

        .fare-box strong {
            font-size: 18px;
            color: var(--primary);
        }

        /* QR Section */
        .qr-card {
            text-align: center;
            background: #fafafa;
            border: 1.5px solid #edf2f7;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .qr-card p {
            font-size: 13px;
            font-weight: 600;
            color: var(--secondary);
            margin-bottom: 8px;
        }

        .qr-card img {
            width: 170px;
            height: 170px;
            object-fit: contain;
            border-radius: 8px;
            border: 1px solid #ddd;
            background: #fff;
            padding: 5px;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(37, 211, 102, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: #718096;
        }

        .footer a {
            color: var(--secondary);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Hero Header -->
    <div class="hero">
        <span class="badge-ev"><i class="fa-solid fa-bolt"></i> 100% Electric Deluxe Hiace</span>
        <h1>Gulmi Easy Travel</h1>
        <p>Gulmi - Kathmandu - Butwal Direct Service</p>
    </div>

    <!-- Booking Form Container -->
    <div class="container">
        <div class="card">
            <form id="bookingForm">
                
                <!-- Full Name -->
                <div class="form-group">
                    <label><i class="fa-solid fa-user"></i> Full Name</label>
                    <input type="text" id="name" class="form-control" placeholder="Tapaiko Naam" required>
                </div>

                <!-- Phone Number -->
                <div class="form-group">
                    <label><i class="fa-solid fa-phone"></i> Mobile / WhatsApp Number</label>
                    <input type="tel" id="phone" class="form-control" placeholder="98XXXXXXXX" required>
                </div>

                <!-- Route Selection -->
                <div class="form-group">
                    <label><i class="fa-solid fa-route"></i> Select Route</label>
                    <select id="route" class="form-control" onchange="calculateFare()">
                        <option value="Gulmi to Kathmandu" data-price="1300">Gulmi ➔ Kathmandu (Rs. 1,300)</option>
                        <option value="Kathmandu to Gulmi" data-price="1300">Kathmandu ➔ Gulmi (Rs. 1,300)</option>
                        <option value="Gulmi to Butwal" data-price="600">Gulmi ➔ Butwal (Rs. 600)</option>
                        <option value="Butwal to Gulmi" data-price="600">Butwal ➔ Gulmi (Rs. 600)</option>
                    </select>
                </div>

                <!-- Travel Date -->
                <div class="form-group">
                    <label><i class="fa-solid fa-calendar-days"></i> Travel Date</label>
                    <input type="date" id="date" class="form-control" required>
                </div>

                <!-- Number of Seats -->
                <div class="form-group">
                    <label><i class="fa-solid fa-chair"></i> Number of Seats</label>
                    <select id="seats" class="form-control" onchange="calculateFare()">
                        <option value="1">1 Seat</option>
                        <option value="2">2 Seats</option>
                        <option value="3">3 Seats</option>
                        <option value="4">4 Seats</option>
                        <option value="5">5 Seats</option>
                    </select>
                </div>

                <!-- Pickup Point -->
                <div class="form-group">
                    <label><i class="fa-solid fa-location-dot"></i> Boarding / Pickup Point</label>
                    <input type="text" id="pickup" class="form-control" placeholder="Eg: Tamghas, Simeltari, Gongabu" required>
                </div>

                <!-- Total Fare Calculation Display -->
                <div class="fare-box">
                    <span>Estimated Total Fare:</span>
                    <strong id="totalFare">Rs. 1,300</strong>
                </div>

                <!-- QR Code Display -->
                <div class="qr-card">
                    <p><i class="fa-solid fa-qrcode"></i> Scan to Pay (eSewa / Khalti / Mobile Banking)</p>
                    <img src="qr.png" alt="Payment QR Code" onerror="this.src='https://via.placeholder.com/170?text=Upload+qr.png'">
                </div>

                <!-- Submit Button -->
                <button type="button" class="btn-submit" onclick="sendToWhatsApp()">
                    <i class="fa-brands fa-whatsapp"></i> Confirm Booking via WhatsApp
                </button>

            </form>
        </div>

        <div class="footer">
            <p>Direct Booking Helpline: <strong>9749895042</strong></p>
            <p>&copy; Gulmi Easy Travel EV Service. All rights reserved.</p>
        </div>
    </div>

    <!-- JavaScript logic -->
    <script>
        // Set Default Date to Today
        document.getElementById('date').valueAsDate = new Date();

        // Calculate Fare Dynamically
        function calculateFare() {
            var routeSelect = document.getElementById('route');
            var selectedOption = routeSelect.options[routeSelect.selectedIndex];
            var pricePerSeat = parseInt(selectedOption.getAttribute('data-price'));
            var seats = parseInt(document.getElementById('seats').value);
            
            var total = pricePerSeat * seats;
            document.getElementById('totalFare').innerText = "Rs. " + total.toLocaleString();
        }

        // WhatsApp Direct Booking
        function sendToWhatsApp() {
            var name = document.getElementById('name').value.trim();
            var phone = document.getElementById('phone').value.trim();
            var route = document.getElementById('route').value;
            var date = document.getElementById('date').value;
            var seats = document.getElementById('seats').value;
            var pickup = document.getElementById('pickup').value.trim();
            var totalFare = document.getElementById('totalFare').innerText;

            if(!name || !phone || !pickup || !date) {
                alert("Kripaya sabai bibaran bharnuhola!");
                return;
            }

            // Tapaiko WhatsApp Mobile Number
            var targetNumber = "9779749895042";

            var message = "*GULMI EASY TRAVEL - TICKET BOOKING*%0A" +
                          "━━━━━━━━━━━━━━━━━━%0A" +
                          "👤 *Passenger Name:* " + name + "%0A" +
                          "📞 *Phone Number:* " + phone + "%0A" +
                          "🚌 *Route:* " + route + "%0A" +
                          "📅 *Travel Date:* " + date + "%0A" +
                          "💺 *Seats:* " + seats + "%0A" +
                          "📍 *Pickup Location:* " + pickup + "%0A" +
                          "💰 *Total Amount:* " + totalFare + "%0A" +
                          "━━━━━━━━━━━━━━━━━━%0A" +
                          "Maile Payment QR code ma tirera screenshot pathaudai chu.";

            var whatsappUrl = "https://wa.me/" + targetNumber + "?text=" + message;
            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>
